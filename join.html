<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join PropsTrack Project</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #09090F;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 380px;
      width: 100%;
    }
    .logo { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    p { color: #888; font-size: 15px; margin-bottom: 28px; line-height: 1.5; }
    .btn {
      display: block;
      background: #A78BFA;
      color: #000;
      padding: 16px 24px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .hint { color: #555; font-size: 13px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🎬</div>
    <h1>Project Invite</h1>
    <p>You've been invited to join a project on <strong>PropsTrack</strong>. Tap the button below to open the app and accept the invite.</p>
    <a id="open-btn" href="#" class="btn">Open in PropsTrack →</a>
    <p class="hint">Make sure you have PropsTrack installed.</p>
  </div>
  <script>
    const code = new URLSearchParams(window.location.search).get('code');
    if (code) {
      const appUrl = 'propstrack://join?code=' + code;
      document.getElementById('open-btn').href = appUrl;
      setTimeout(() => { window.location.href = appUrl; }, 800);
    }
  </script>
</body>
</html>
